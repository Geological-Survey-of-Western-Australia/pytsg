# Read the Docs builds from GitHub against public PyPI, independent of the
# Azure DevOps pipeline. uv.lock resolves from pypi.org, so `uv sync` can use
# it as-is here.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: uv
      command: sync
      # sphinx and its extensions live in the dev group
      groups:
        - dev

sphinx:
  configuration: doc/source/conf.py
  fail_on_warning: true
